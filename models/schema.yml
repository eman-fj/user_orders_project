version: 2

sources:
  - name: raw
    database: ANALYTICS_DB
    schema: RAW
    tables:
      - name: users
      - name: orders
      - name: demographics_raw

models:
  - name: stg_users
    columns:
      - name: user_id
        tests:
          - not_null
          - unique

  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

  - name: stg_demographics
    columns:
      - name: user_id
        tests:
          - not_null
          - unique

  - name: user_order_summary
    columns:
      - name: user_id
        tests:
          - not_null